version: '3.8'

services:
  bhoomikavach:
    build: .
    container_name: bhoomikavach_platform
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./vector_store:/app/vector_store
    restart: unless-stopped
